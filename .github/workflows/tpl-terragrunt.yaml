name: Terragrunt Workflow Template

on:
  workflow_call:
    inputs:
      action:
        description: "plan | apply"
        required: true
        type: string

concurrency:
  group: terragrunt-${{ github.repository }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  TG_ALL: true
  TG_LOG_LEVEL: error
  TG_NON_INTERACTIVE: true
  # TG_PARALLELISM: 1 // Check if it needed, sometimes with PostgreSQL Backend cause issues with concurrency
  TF_STRICT_MODE: true
  TG_WORKING_DIR: ./iac
  TG_VERSION: v0.99.2
  TOFU_VERSION: v1.11.5
  VAULT_VERSION: v1.20.2
  VAULT_HELPER_VERSION: main
  VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
  VAULT_AGENT_CONFIG: ${{ vars.VAULT_AGENT_CONFIG }}
  VAULT_CLIENT_ID: ${{ secrets.VAULT_CLIENT_ID }}
  VAULT_SECRET_ID: ${{ secrets.VAULT_SECRET_ID }}

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Validate action input
        run: |
          if [[ "${{ inputs.action }}" != "plan" && "${{ inputs.action }}" != "apply" ]]; then
            echo "Invalid action: ${{ inputs.action }}"
            exit 1
          fi

  plan:
    needs:
      - setup
    if: ${{ inputs.action == 'plan' }}
    runs-on: ubuntu-latest
    outputs:
      pr_number: ${{ steps.pr_context.outputs.pr_number }}
      head_sha: ${{ steps.pr_context.outputs.head_sha }}
      artifact_name: ${{ steps.pack.outputs.artifact_name }}
    steps:
      - name: Resolve PR context
        id: pr_context
        run: |
          set -euo pipefail
          echo "pr_number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          echo "head_sha=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          echo "base_sha=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr_context.outputs.head_sha }}
          fetch-depth: 0

      - name: Install terragrunt
        uses: gruntwork-io/terragrunt-action@v3
        with:
          tg_version: ${{ env.TG_VERSION }}
          tofu_version: ${{ env.TOFU_VERSION }}

      - name: Get secrets from vault
        uses: proxmox-home-lab/github-actions/.github/actions/vault-secrets@main
        with:
          vault_version: ${{ env.VAULT_VERSION }}
          vault_helper_version: ${{ env.VAULT_HELPER_VERSION }}

      - name: Detect terragrunt stacks from changed files
        id: detect_stacks
        run: |
          set -euo pipefail

          base_sha="${{ steps.pr_context.outputs.base_sha }}"
          head_sha="${{ steps.pr_context.outputs.head_sha }}"
          tg_dir="${TG_WORKING_DIR#./}"

          mapfile -t changed_files < <(git diff --name-only "$base_sha" "$head_sha" -- "$tg_dir")
          mapfile -t all_stacks < <(find "$tg_dir" -type f -name "terragrunt.stack.hcl" -printf '%h\n' | sort -u)

          if [[ ${#all_stacks[@]} -eq 0 ]]; then
            echo "No terragrunt stacks found under $tg_dir"
            exit 1
          fi

          if [[ ${#changed_files[@]} -eq 0 ]]; then
            echo "No files changed under $tg_dir; using all stacks for safety."
            printf '%s\n' "${all_stacks[@]}" > target_stacks.txt
            echo "target_mode=all_stacks" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          declare -A stacks=()
          global_change=false

          for file in "${changed_files[@]}"; do
            dir="$(dirname "$file")"
            found_stack=""

            while [[ "$dir" != "$tg_dir" && "$dir" != "." && "$dir" != "/" ]]; do
              if [[ -f "$dir/terragrunt.stack.hcl" ]]; then
                found_stack="$dir"
                break
              fi
              dir="$(dirname "$dir")"
            done

            if [[ -n "$found_stack" ]]; then
              stacks["$found_stack"]=1
            else
              # iac/common.hcl, iac/root.hcl, env files, etc. can impact all stacks.
              global_change=true
            fi
          done

          if [[ "$global_change" == "true" ]]; then
            echo "Detected global IaC changes; running all stacks."
            printf '%s\n' "${all_stacks[@]}" > target_stacks.txt
            echo "target_mode=all_stacks" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ ${#stacks[@]} -eq 0 ]]; then
            echo "No stack-specific changes detected; running all stacks for safety."
            printf '%s\n' "${all_stacks[@]}" > target_stacks.txt
            echo "target_mode=all_stacks" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf '%s\n' "${!stacks[@]}" | sort > target_stacks.txt

          echo "target_mode=targeted" >> "$GITHUB_OUTPUT"
          echo "Target stacks:"
          cat target_stacks.txt

      - name: Run terragrunt validate
        run: |
          set -euo pipefail

          mapfile -t target_stacks < target_stacks.txt
          for stack_dir in "${target_stacks[@]}"; do
            echo "Validating stack: $stack_dir"
            (
              terragrunt stack run --working-dir "$stack_dir" -- validate
            )
          done

      - name: Run terragrunt plan
        id: terragrunt_plan
        run: |
          set -euo pipefail

          : > plan.log
          exit_code=0
          mapfile -t target_stacks < target_stacks.txt

          for stack_dir in "${target_stacks[@]}"; do
            echo "Planning stack: $stack_dir" | tee -a plan.log
            (
              terragrunt stack run --working-dir "$stack_dir" -- plan -out=tfplan.binary
            ) 2>&1 | tee -a plan.log
            cmd_exit="${PIPESTATUS[0]}"
            if [[ "$cmd_exit" -ne 0 ]]; then
              exit_code="$cmd_exit"
            fi
          done

          exit "$exit_code"

      - name: Stage plan artifact files
        if: ${{ success() }}
        id: pack
        run: |
          set -euo pipefail
          artifact_name="terragrunt-plan-pr${{ steps.pr_context.outputs.pr_number }}-sha${{ steps.pr_context.outputs.head_sha }}"
          echo "artifact_name=${artifact_name}" >> "$GITHUB_OUTPUT"

          mkdir -p plan-artifact
          cd "${TG_WORKING_DIR}"
          find . -type f -name 'tfplan.binary' -print0 | tar --null --files-from=- -czf "$OLDPWD/plan-artifact/terragrunt-plan-files.tgz"
          cd "$OLDPWD"
          echo "${{ steps.detect_stacks.outputs.target_mode }}" > plan-artifact/target_mode.txt
          cp target_stacks.txt plan-artifact/target_stacks.txt
          cp plan.log plan-artifact/plan.log

      - name: Upload terragrunt plan artifact
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.artifact_name }}
          if-no-files-found: error
          retention-days: 14
          path: plan-artifact/

      - name: Summarize terragrunt plan
        id: plan_summarize
        uses: proxmox-home-lab/github-actions/.github/actions/tg-summarize@main
        with:
          log_path: plan.log
          mode: plan
          run_outcome: ${{ steps.terragrunt_plan.outcome }}
          github_token: ${{ github.token }}
          repo: ${{ github.repository }}
          run_id: ${{ github.run_id }}
          job_name: ${{ github.job }}

      - name: Find existing plan comment
        id: find_comment
        uses: peter-evans/find-comment@v3
        with:
          token: ${{ github.token }}
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: "<!-- Terragrunt PR Comment -->"
          direction: last

      - name: PR Comment for Plan
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ github.token }}
          comment-id: ${{ steps.find_comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: |
            <!-- Terragrunt PR Comment -->
            ${{ steps.plan_summarize.outputs.summary }}

  # Runs BEFORE the environment gate so the reviewer can see the plan
  # in the Actions UI before approving the apply job.
  # Downloads the exact artifact produced during the PR plan — no re-planning.
  show-plan:
    needs:
      - setup
    if: ${{ inputs.action == 'apply' }}
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.find_artifact.outputs.artifact_name }}
      plan_run_id: ${{ steps.find_artifact.outputs.plan_run_id }}
    steps:
      - name: Find PR plan artifact
        id: find_artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          pr_number=$(gh api "/repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            --jq '.[0].number // empty')

          if [[ -z "$pr_number" ]]; then
            echo "::error::Could not determine PR number for commit ${{ github.sha }}"
            exit 1
          fi

          pr_head_sha=$(gh api "/repos/${{ github.repository }}/pulls/${pr_number}" \
            --jq '.head.sha')

          artifact_name="terragrunt-plan-pr${pr_number}-sha${pr_head_sha}"

          plan_run_id=$(gh run list \
            --repo "${{ github.repository }}" \
            --event pull_request \
            --json databaseId,headSha,conclusion \
            --jq ".[] | select(.headSha == \"${pr_head_sha}\" and .conclusion == \"success\") | .databaseId" \
            | head -1)

          if [[ -z "$plan_run_id" ]]; then
            echo "::error::No successful plan run found for PR ${pr_number} (head SHA: ${pr_head_sha})"
            exit 1
          fi

          echo "artifact_name=${artifact_name}" >> "$GITHUB_OUTPUT"
          echo "plan_run_id=${plan_run_id}" >> "$GITHUB_OUTPUT"
          echo "Resolved: PR #${pr_number}, head SHA ${pr_head_sha}, plan run ${plan_run_id}"

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.find_artifact.outputs.artifact_name }}
          run-id: ${{ steps.find_artifact.outputs.plan_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/terragrunt-plan-artifact

      - name: Write plan summary for reviewer
        id: plan_summarize
        uses: proxmox-home-lab/github-actions/.github/actions/tg-summarize@main
        with:
          log_path: ${{ runner.temp }}/terragrunt-plan-artifact/plan.log
          mode: plan
          run_outcome: success
          github_token: ${{ github.token }}
          repo: ${{ github.repository }}
          run_id: ${{ steps.find_artifact.outputs.plan_run_id }}
          job_name: plan

      - name: Write to Job Summary
        run: |
          echo "${{ steps.plan_summarize.outputs.summary }}" >> "$GITHUB_STEP_SUMMARY"

  apply:
    needs:
      - setup
      - show-plan
    if: ${{ inputs.action == 'apply' }}
    runs-on: ubuntu-latest
    # No environment gate here: approval happens via CODEOWNERS review on the PR
    # before merge. The branch ruleset enforces require_code_owner_review = true,
    # so the merge itself is the gated approval.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install terragrunt
        uses: gruntwork-io/terragrunt-action@v3
        with:
          tg_version: ${{ env.TG_VERSION }}
          tofu_version: ${{ env.TOFU_VERSION }}

      - name: Get secrets from vault
        uses: proxmox-home-lab/github-actions/.github/actions/vault-secrets@main
        with:
          vault_version: ${{ env.VAULT_VERSION }}
          vault_helper_version: ${{ env.VAULT_HELPER_VERSION }}

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.show-plan.outputs.artifact_name }}
          run-id: ${{ needs.show-plan.outputs.plan_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/terragrunt-plan-artifact

      - name: Extract plan files
        run: |
          set -euo pipefail
          tar -xzf "$RUNNER_TEMP/terragrunt-plan-artifact/terragrunt-plan-files.tgz" -C "${TG_WORKING_DIR}"

      - name: Run terragrunt apply
        id: terragrunt_apply
        run: |
          set -euo pipefail

          target_mode="$(cat "$RUNNER_TEMP/terragrunt-plan-artifact/target_mode.txt")"
          if [[ "$target_mode" != "targeted" && "$target_mode" != "all_stacks" ]]; then
            echo "Invalid target_mode: $target_mode"
            exit 1
          fi

          : > apply.log
          exit_code=0
          mapfile -t target_stacks < "$RUNNER_TEMP/terragrunt-plan-artifact/target_stacks.txt"

          for stack_dir in "${target_stacks[@]}"; do
            echo "Applying stack: $stack_dir" | tee -a apply.log
            (
              terragrunt stack run --working-dir "$stack_dir" -- apply tfplan.binary
            ) 2>&1 | tee -a apply.log
            cmd_exit="${PIPESTATUS[0]}"
            if [[ "$cmd_exit" -ne 0 ]]; then
              exit_code="$cmd_exit"
            fi
          done

          exit "$exit_code"

      - name: Summarize terragrunt apply
        if: ${{ always() }}
        id: apply_summarize
        uses: proxmox-home-lab/github-actions/.github/actions/tg-summarize@main
        with:
          log_path: apply.log
          mode: apply
          run_outcome: ${{ steps.terragrunt_apply.outcome }}
          github_token: ${{ github.token }}
          repo: ${{ github.repository }}
          run_id: ${{ github.run_id }}
          job_name: ${{ github.job }}

      - name: Write apply summary
        if: ${{ always() }}
        run: |
          echo "${{ steps.apply_summarize.outputs.summary }}" >> "$GITHUB_STEP_SUMMARY"
