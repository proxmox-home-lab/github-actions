name: Terragrunt Workflow Template

on:
  workflow_call:
    inputs:
      action:
        description: "plan | apply"
        required: true
        type: string
      runner_label:
        description: "GitHub Actions runner label. Override to [self-hosted, proxmox] for Proxmox access."
        required: false
        type: string
        default: "ubuntu-latest"
      working_dir:
        description: "Root directory to search for terragrunt.stack.hcl files (e.g. iac/prod)."
        required: false
        type: string
        default: "iac"

# Concurrency scoped per repo + PR/push. Stack-level isolation is provided
# by the matrix strategy — parallel stacks run concurrently within the same run.
concurrency:
  group: terragrunt-${{ github.repository }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  TG_LOG_LEVEL: error
  TG_NON_INTERACTIVE: true
  TF_STRICT_MODE: true
  TG_VERSION: v1.0.0-rc3
  TOFU_VERSION: v1.11.5
  VAULT_VERSION: v1.20.2
  VAULT_HELPER_VERSION: main
  VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
  VAULT_AGENT_CONFIG: ${{ vars.VAULT_AGENT_CONFIG }}
  VAULT_CLIENT_ID: ${{ secrets.VAULT_CLIENT_ID }}
  VAULT_SECRET_ID: ${{ secrets.VAULT_SECRET_ID }}

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Validate action input
        run: |
          if [[ "${{ inputs.action }}" != "plan" && "${{ inputs.action }}" != "apply" ]]; then
            echo "Invalid action: ${{ inputs.action }}"
            exit 1
          fi

  # Detect which stacks under working_dir have changed files.
  # Outputs a JSON matrix consumed by the plan/apply jobs.
  detect:
    needs: setup
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      has_stacks: ${{ steps.detect.outputs.has_stacks }}
      pr_number: ${{ steps.detect.outputs.pr_number }}
      head_sha: ${{ steps.detect.outputs.head_sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed stacks
        id: detect
        run: |
          set -euo pipefail

          echo "pr_number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          echo "head_sha=${{ github.event.pull_request.head.sha || github.sha }}" >> "$GITHUB_OUTPUT"

          # Find all stack directories under working_dir
          mapfile -t all_stacks < <(find "${{ inputs.working_dir }}" -name "terragrunt.stack.hcl" -exec dirname {} \; 2>/dev/null | sort || true)

          if [[ ${#all_stacks[@]} -eq 0 ]]; then
            echo "No stacks found under ${{ inputs.working_dir }}"
            echo "matrix={\"include\":[]}" >> "$GITHUB_OUTPUT"
            echo "has_stacks=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Determine changed files for this event
          if [[ "${{ inputs.action }}" == "plan" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            head_sha="${{ github.event.pull_request.head.sha }}"
            changed_files=$(git diff --name-only "${base_sha}" "${head_sha}")
          else
            # apply: changes introduced by the push/merge commit
            changed_files=$(git diff --name-only "HEAD~1" "HEAD")
          fi

          # Filter to stacks that contain changed files
          changed_stacks=()
          for stack_dir in "${all_stacks[@]}"; do
            if echo "${changed_files}" | grep -q "^${stack_dir}/"; then
              changed_stacks+=("${stack_dir}")
            fi
          done

          if [[ ${#changed_stacks[@]} -eq 0 ]]; then
            echo "No stacks have changes — skipping."
            echo "matrix={\"include\":[]}" >> "$GITHUB_OUTPUT"
            echo "has_stacks=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Build JSON matrix with stack_dir and a filesystem-safe stack_slug
          matrix_items=""
          for stack_dir in "${changed_stacks[@]}"; do
            stack_slug=$(echo "${stack_dir}" | tr '/' '-' | tr '.' '-')
            [[ -n "${matrix_items}" ]] && matrix_items+=","
            matrix_items+="{\"stack_dir\":\"${stack_dir}\",\"stack_slug\":\"${stack_slug}\"}"
          done

          echo "matrix={\"include\":[${matrix_items}]}" >> "$GITHUB_OUTPUT"
          echo "has_stacks=true" >> "$GITHUB_OUTPUT"
          echo "Detected changed stacks: ${changed_stacks[*]}"

  # Plan all changed stacks in parallel. Each job uploads:
  #   • the plan binary artifact (consumed by apply)
  #   • a plan-summary artifact (consumed by the comment job)
  plan:
    needs: detect
    if: ${{ inputs.action == 'plan' && needs.detect.outputs.has_stacks == 'true' }}
    strategy:
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
      fail-fast: false
    runs-on: ${{ inputs.runner_label }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.detect.outputs.head_sha }}
          fetch-depth: 0

      - name: Install terragrunt
        uses: gruntwork-io/terragrunt-action@v3
        with:
          tg_version: ${{ env.TG_VERSION }}
          tofu_version: ${{ env.TOFU_VERSION }}

      - name: Get secrets from vault
        uses: proxmox-home-lab/github-actions/.github/actions/vault-secrets@main
        with:
          vault_version: ${{ env.VAULT_VERSION }}
          vault_helper_version: ${{ env.VAULT_HELPER_VERSION }}

      - name: Run terragrunt validate
        run: |
          set -euo pipefail
          terragrunt stack run --working-dir "${{ matrix.stack_dir }}" -- validate

      - name: Run terragrunt plan
        id: terragrunt_plan
        run: |
          set -euo pipefail
          # --out-dir saves plan files to a deterministic path outside the cache dir.
          # This avoids cache-hash mismatches between plan and apply runners.
          terragrunt stack run --working-dir "${{ matrix.stack_dir }}" --out-dir "$GITHUB_WORKSPACE/plan-files" -- plan 2>&1 | tee plan.log

      - name: Stage plan artifact files
        if: ${{ success() }}
        id: pack
        run: |
          set -euo pipefail
          # stack_slug in artifact name prevents collision between parallel matrix jobs
          artifact_name="terragrunt-plan-pr${{ needs.detect.outputs.pr_number }}-sha${{ needs.detect.outputs.head_sha }}-${{ matrix.stack_slug }}"
          echo "artifact_name=${artifact_name}" >> "$GITHUB_OUTPUT"

          mkdir -p plan-artifact
          tar -czf plan-artifact/terragrunt-plan-files.tgz -C "$GITHUB_WORKSPACE" plan-files/
          cp plan.log plan-artifact/plan.log

      - name: Upload plan artifact
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.artifact_name }}
          if-no-files-found: error
          retention-days: 14
          path: plan-artifact/

      - name: Summarize terragrunt plan
        if: ${{ always() }}
        id: plan_summarize
        uses: proxmox-home-lab/github-actions/.github/actions/tg-summarize@main
        with:
          log_path: plan.log
          mode: plan
          run_outcome: ${{ steps.terragrunt_plan.outcome }}
          github_token: ${{ github.token }}
          repo: ${{ github.repository }}
          run_id: ${{ github.run_id }}
          job_name: ${{ github.job }}
          stack_dir: ${{ matrix.stack_dir }}

      - name: Write plan summary to file
        if: ${{ always() }}
        env:
          SUMMARY: ${{ steps.plan_summarize.outputs.summary }}
        run: |
          printf '%s\n' "$SUMMARY" > plan-summary.md

      - name: Upload plan summary artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: plan-summary-${{ matrix.stack_slug }}
          path: plan-summary.md
          if-no-files-found: warn

  # Aggregates plan summaries from all matrix jobs into a single PR comment.
  # Runs even if some plan jobs failed so partial results are always visible.
  comment:
    needs: [detect, plan]
    if: ${{ always() && inputs.action == 'plan' && needs.detect.outputs.has_stacks == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      # PR comments go through the issues API endpoint — issues: write is required.
      # pull-requests: write alone is not sufficient for issue/PR comment creation.
      issues: write
      pull-requests: write
    steps:
      - name: Download all plan summaries
        uses: actions/download-artifact@v4
        with:
          pattern: plan-summary-*
          path: summaries/

      - name: Aggregate plan summaries
        run: |
          set -euo pipefail
          {
            echo "<!-- Terragrunt Plan -->"
            first=true
            for dir in summaries/plan-summary-*/; do
              [[ -d "$dir" ]] || continue
              if [[ "$first" != "true" ]]; then
                printf '\n---\n\n'
              fi
              cat "${dir}plan-summary.md" 2>/dev/null || echo "_Summary unavailable for this stack._"
              first=false
            done
          } > aggregated-comment.md

      - name: Find existing plan comment
        id: find_comment
        uses: peter-evans/find-comment@v3
        with:
          token: ${{ github.token }}
          issue-number: ${{ needs.detect.outputs.pr_number }}
          comment-author: github-actions[bot]
          body-includes: "<!-- Terragrunt Plan -->"
          direction: last

      - name: Post aggregated plan comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ github.token }}
          comment-id: ${{ steps.find_comment.outputs.comment-id }}
          issue-number: ${{ needs.detect.outputs.pr_number }}
          edit-mode: replace
          body-path: aggregated-comment.md

  # Apply all changed stacks in parallel. Approval is enforced upstream by
  # branch protection (require_code_owner_review) — merging IS the approval.
  apply:
    needs: detect
    if: ${{ inputs.action == 'apply' && needs.detect.outputs.has_stacks == 'true' }}
    strategy:
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
      fail-fast: false
    runs-on: ${{ inputs.runner_label }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install terragrunt
        uses: gruntwork-io/terragrunt-action@v3
        with:
          tg_version: ${{ env.TG_VERSION }}
          tofu_version: ${{ env.TOFU_VERSION }}

      - name: Get secrets from vault
        uses: proxmox-home-lab/github-actions/.github/actions/vault-secrets@main
        with:
          vault_version: ${{ env.VAULT_VERSION }}
          vault_helper_version: ${{ env.VAULT_HELPER_VERSION }}

      - name: Find and download plan artifact
        id: find_artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Extract PR number from the merge commit message — the /commits/{sha}/pulls
          # API endpoint returns empty for merge commits because the merge commit itself
          # is not part of the PR's commits, only of main's history.
          #   Regular merge:  "Merge pull request #37 from owner/branch"
          #   Squash merge:   "Some title (#37)"
          commit_msg=$(git log -1 --format="%s" HEAD)
          pr_number=$(echo "$commit_msg" | grep -oP '(?<=pull request #)\d+|(?<=\(#)\d+(?=\))' | head -1 || true)

          if [[ -z "$pr_number" ]]; then
            echo "::error::Could not determine PR number from commit message: ${commit_msg}"
            exit 1
          fi

          pr_head_sha=$(gh api "/repos/${{ github.repository }}/pulls/${pr_number}" \
            --jq '.head.sha')

          artifact_name="terragrunt-plan-pr${pr_number}-sha${pr_head_sha}-${{ matrix.stack_slug }}"

          plan_run_id=$(gh run list \
            --repo "${{ github.repository }}" \
            --event pull_request \
            --json databaseId,headSha,conclusion \
            --jq ".[] | select(.headSha == \"${pr_head_sha}\" and .conclusion == \"success\") | .databaseId" \
            | head -1)

          if [[ -z "$plan_run_id" ]]; then
            echo "::error::No successful plan run found for PR ${pr_number} (head SHA: ${pr_head_sha})"
            exit 1
          fi

          echo "artifact_name=${artifact_name}" >> "$GITHUB_OUTPUT"
          echo "plan_run_id=${plan_run_id}" >> "$GITHUB_OUTPUT"
          echo "Resolved: PR #${pr_number}, head SHA ${pr_head_sha}, plan run ${plan_run_id}"

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.find_artifact.outputs.artifact_name }}
          run-id: ${{ steps.find_artifact.outputs.plan_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/terragrunt-plan-artifact

      - name: Extract plan files
        run: |
          set -euo pipefail
          tar -xzf "$RUNNER_TEMP/terragrunt-plan-artifact/terragrunt-plan-files.tgz" -C "$GITHUB_WORKSPACE"

      - name: Run terragrunt apply
        id: terragrunt_apply
        run: |
          set -euo pipefail
          # --out-dir tells Terragrunt where to find the plan files saved during the plan job.
          terragrunt stack run --working-dir "${{ matrix.stack_dir }}" --out-dir "$GITHUB_WORKSPACE/plan-files" -- apply 2>&1 | tee apply.log

      - name: Summarize terragrunt apply
        if: ${{ always() }}
        id: apply_summarize
        uses: proxmox-home-lab/github-actions/.github/actions/tg-summarize@main
        with:
          log_path: apply.log
          mode: apply
          run_outcome: ${{ steps.terragrunt_apply.outcome }}
          github_token: ${{ github.token }}
          repo: ${{ github.repository }}
          run_id: ${{ github.run_id }}
          job_name: ${{ github.job }}
          stack_dir: ${{ matrix.stack_dir }}

      - name: Write apply summary
        if: ${{ always() }}
        env:
          SUMMARY: ${{ steps.apply_summarize.outputs.summary }}
        run: |
          printf '%s\n' "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"
